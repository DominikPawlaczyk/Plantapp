  <use href="#vine-leaf" transform="translate(250, 790) rotate(-35) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(300, 720) rotate(-50) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(340, 650) rotate(-25) scale(1.7)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(370, 580) rotate(-60) scale(1.5)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(365, 510) rotate(-40) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(350, 440) rotate(-70) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(330, 370) rotate(-30) scale(1.7)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(305, 300) rotate(-55) scale(1.5)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(285, 230) rotate(-35) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(275, 160) rotate(-65) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(285, 90) rotate(-45) scale(1.5)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(295, 30) rotate(-50) scale(1.3)" opacity="0.85" />
  
  <!-- Leaves distributed along the vines - Right vine -->
  <use href="#vine-leaf" transform="translate(655, 1150) rotate(45) scale(1.5)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(640, 1080) rotate(30) scale(1.7)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(620, 1010) rotate(55) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(595, 940) rotate(25) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(565, 870) rotate(60) scale(1.5)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(530, 800) rotate(35) scale(1.7)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(495, 730) rotate(50) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(475, 660) rotate(20) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(470, 590) rotate(65) scale(1.5)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(485, 520) rotate(40) scale(1.7)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(510, 450) rotate(70) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(545, 380) rotate(30) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(575, 310) rotate(55) scale(1.5)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(595, 240) rotate(35) scale(1.7)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(605, 170) rotate(65) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(595, 100) rotate(45) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(585, 50) rotate(50) scale(1.3)" opacity="0.85" />
  
  <!-- Leaves on connecting branches -->
  <use href="#vine-leaf" transform="translate(250, 890) rotate(-15) scale(1.2)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(350, 870) rotate(10) scale(1.3)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(380, 685) rotate(-10) scale(1.2)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(450, 675) rotate(15) scale(1.3)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(400, 455) rotate(-5) scale(1.2)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(490, 455) rotate(5) scale(1.3)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(360, 235) rotate(-8) scale(1.2)" opacity="0.75" />
  <use href="#vine-leaf" transform="translate(470, 230) rotate(12) scale(1.3)" opacity="0.75" />
  
  <!-- Small leaves on tendrils -->
  <use href="#vine-leaf" transform="translate(80, 950) rotate(-80) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(290, 780) rotate(75) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(410, 560) rotate(85) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(370, 320) rotate(70) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(350, 100) rotate(65) scale(0.9)" opacity="0.65" />
  
  <use href="#vine-leaf" transform="translate(690, 980) rotate(80) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(480, 820) rotate(-75) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(390, 600) rotate(-85) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(610, 360) rotate(70) scale(0.9)" opacity="0.65" />
  <use href="#vine-leaf" transform="translate(680, 220) rotate(75) scale(0.9)" opacity="0.65" />
  
  <!-- Decorative tendrils -->
  <use href="#tendril" transform="translate(140, 1050) rotate(-120) scale(1.2)" opacity="0.5" />
  <use href="#tendril" transform="translate(280, 750) rotate(60) scale(1.3)" opacity="0.5" />
  <use href="#tendril" transform="translate(380, 530) rotate(-90) scale(1.1)" opacity="0.5" />
  <use href="#tendril" transform="translate(320, 350) rotate(45) scale(1.2)" opacity="0.5" />
  <use href="#tendril" transform="translate(620, 1000) rotate(110) scale(1.2)" opacity="0.5" />
  <use href="#tendril" transform="translate(500, 850) rotate(-70) scale(1.3)" opacity="0.5" />
  <use href="#tendril" transform="translate(450, 630) rotate(80) scale(1.1)" opacity="0.5" />
  <use href="#tendril" transform="translate(570, 400) rotate(-50) scale(1.2)" opacity="0.5" />
  
