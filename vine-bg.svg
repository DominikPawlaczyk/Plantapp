<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" style="background-color: transparent;">
  <defs>
    <!-- Elegant vine leaf with detailed veins -->
    <g id="vine-leaf" stroke="#52525B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Leaf outline (heart-shaped with pointed tip) -->
      <path d="M 0,0 C -25,-8 -38,-5 -42,8 C -45,20 -40,35 -28,48 C -15,62 0,70 0,70 C 0,70 15,62 28,48 C 40,35 45,20 42,8 C 38,-5 25,-8 0,0" 
            fill="#121212" vector-effect="non-scaling-stroke" />
      <!-- Center vein -->
      <path d="M 0,0 L 0,70" fill="none" vector-effect="non-scaling-stroke" />
      <!-- Lateral veins (right) -->
      <path d="M 0,15 C 8,18 15,22 20,28" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,30 C 10,32 18,36 24,42" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,45 C 8,48 14,52 18,58" fill="none" vector-effect="non-scaling-stroke" />
      <!-- Lateral veins (left) -->
      <path d="M 0,15 C -8,18 -15,22 -20,28" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,30 C -10,32 -18,36 -24,42" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,45 C -8,48 -14,52 -18,58" fill="none" vector-effect="non-scaling-stroke" />
    </g>
    
    <!-- Small decorative tendril -->
    <g id="tendril">
      <path d="M 0,0 C 5,-8 10,-12 15,-10 C 20,-8 22,-2 20,5 C 18,12 12,15 8,12" 
            stroke="#52525B" stroke-width="1" fill="none" stroke-linecap="round" />
    </g>
  </defs>
  
  <!-- Main vine structure - flowing from bottom to top -->
  <g stroke="#52525B" stroke-linecap="round" fill="none">
    <!-- Primary vine stem - elegant S-curve from bottom to top -->
    <path d="M 100,1200 C 120,1100 140,1000 180,920 C 220,840 280,780 320,700 C 360,620 380,540 360,460 C 340,380 300,320 280,240 C 260,160 270,80 300,0" 
          stroke-width="2.8" opacity="0.9" vector-effect="non-scaling-stroke" />
    
    <!-- Secondary vine stem - parallel flow -->
    <path d="M 650,1200 C 630,1120 610,1040 580,960 C 550,880 500,820 480,740 C 460,660 470,580 500,500 C 530,420 580,360 600,280 C 620,200 610,120 580,40" 
          stroke-width="2.5" opacity="0.85" vector-effect="non-scaling-stroke" />
    
    <!-- Tertiary connecting vines -->
    <path d="M 180,920 C 250,900 320,880 380,860" stroke-width="1.8" opacity="0.7" vector-effect="non-scaling-stroke" />
    <path d="M 320,700 C 380,690 440,680 480,670" stroke-width="1.8" opacity="0.7" vector-effect="non-scaling-stroke" />
    <path d="M 360,460 C 420,450 480,445 540,450" stroke-width="1.8" opacity="0.7" vector-effect="non-scaling-stroke" />
    <path d="M 280,240 C 360,230 440,225 520,230" stroke-width="1.8" opacity="0.7" vector-effect="non-scaling-stroke" />
    
    <!-- Small branch tendrils -->
    <path d="M 140,1000 C 100,980 70,950 50,920" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 220,840 C 260,820 290,790 310,760" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 340,620 C 380,600 410,570 430,540" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 300,380 C 340,360 370,330 390,300" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 270,160 C 310,140 340,110 360,80" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    
    <path d="M 610,1040 C 650,1020 680,990 700,960" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 550,880 C 520,860 490,830 470,800" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 460,660 C 430,640 400,610 380,580" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 530,420 C 570,400 600,370 620,340" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
    <path d="M 600,280 C 640,260 670,230 690,200" stroke-width="1.3" opacity="0.6" vector-effect="non-scaling-stroke" />
  </g>
  
  <!-- Leaves distributed along the vines - Left vine -->
  <use href="#vine-leaf" transform="translate(95, 1150) rotate(-45) scale(1.4)" opacity="0.85" />
  <use href="#vine-leaf" transform="translate(110, 1080) rotate(-30) scale(1.6)" opacity="0.9" />
  <use href="#vine-leaf" transform="translate(130, 1010) rotate(-55) scale(1.3)" opacity="0.85" />
