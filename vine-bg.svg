<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" style="background-color: transparent;">
  <defs>
    <!-- Elongated Epipremnum-style leaf -->
    <g id="vine-leaf" stroke="#52525B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- More elongated heart-shaped leaf -->
      <path d="M 0,0 C -18,-6 -28,-2 -30,10 C -32,22 -28,38 -20,52 C -12,66 -6,78 0,90 C 6,78 12,66 20,52 C 28,38 32,22 30,10 C 28,-2 18,-6 0,0" 
            fill="#121212" vector-effect="non-scaling-stroke" />
      <!-- Center vein -->
      <path d="M 0,0 L 0,90" fill="none" vector-effect="non-scaling-stroke" opacity="0.5" />
      <!-- Lateral veins - angled upward -->
      <path d="M 0,25 C 8,28 14,34 18,42" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
      <path d="M 0,25 C -8,28 -14,34 -18,42" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
      <path d="M 0,50 C 7,54 12,60 15,68" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
      <path d="M 0,50 C -7,54 -12,60 -15,68" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
      <path d="M 0,72 C 5,76 8,82 10,86" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
      <path d="M 0,72 C -5,76 -8,82 -10,86" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
    </g>
    
    <!-- Small elongated leaf -->
    <g id="small-leaf" stroke="#52525B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,0 C -10,-3 -16,0 -18,8 C -19,16 -16,26 -10,36 C -5,44 0,50 0,50 C 0,50 5,44 10,36 C 16,26 19,16 18,8 C 16,0 10,-3 0,0" 
            fill="#121212" vector-effect="non-scaling-stroke" />
      <path d="M 0,0 L 0,50" fill="none" vector-effect="non-scaling-stroke" opacity="0.5" />
      <path d="M 0,15 C 5,18 8,24 10,30" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
      <path d="M 0,15 C -5,18 -8,24 -10,30" fill="none" vector-effect="non-scaling-stroke" opacity="0.4" />
    </g>
  </defs>
  
  <!-- Main vine following the blue line path -->
  <g stroke="#52525B" stroke-linecap="round" fill="none">
    <!-- Main vine - smooth elegant curve matching blue line -->
    <path d="M 280,1200 
             C 290,1150 300,1100 315,1050
             C 330,1000 350,950 375,900
             C 400,850 430,800 460,750
             C 490,700 520,650 545,600
             C 570,550 590,500 605,450
             C 620,400 630,350 640,300
             C 650,250 655,200 660,150
             C 665,100 668,50 670,0" 
          stroke-width="2.2" opacity="0.45" vector-effect="non-scaling-stroke" />
    
    <!-- Short connecting branches that merge with main vine -->
    <!-- Lower section branches -->
    <path d="M 315,1050 C 285,1030 265,1015 255,1005 C 265,1015 285,1025 315,1050" 
          stroke-width="1.4" opacity="0.35" vector-effect="non-scaling-stroke" />
    <path d="M 375,900 C 405,880 425,865 435,855 C 425,865 405,875 375,900" 
          stroke-width="1.4" opacity="0.35" vector-effect="non-scaling-stroke" />
    <path d="M 340,980 C 320,965 305,955 295,950 C 305,955 320,970 340,980" 
          stroke-width="1.2" opacity="0.30" vector-effect="non-scaling-stroke" />
    
    <!-- Middle section branches -->
    <path d="M 460,750 C 430,730 410,715 400,705 C 410,715 430,725 460,750" 
          stroke-width="1.4" opacity="0.35" vector-effect="non-scaling-stroke" />
    <path d="M 545,600 C 575,580 595,565 605,555 C 595,565 575,575 545,600" 
          stroke-width="1.4" opacity="0.35" vector-effect="non-scaling-stroke" />
    <path d="M 500,680 C 480,665 465,655 455,650 C 465,655 480,670 500,680" 
          stroke-width="1.2" opacity="0.30" vector-effect="non-scaling-stroke" />
    <path d="M 520,640 C 545,625 560,615 570,610 C 560,615 545,630 520,640" 
          stroke-width="1.2" opacity="0.30" vector-effect="non-scaling-stroke" />
    
    <!-- Upper section branches -->
    <path d="M 605,450 C 575,430 555,415 545,405 C 555,415 575,425 605,450" 
          stroke-width="1.4" opacity="0.35" vector-effect="non-scaling-stroke" />
    <path d="M 640,300 C 670,280 690,265 700,255 C 690,265 670,275 640,300" 
          stroke-width="1.4" opacity="0.35" vector-effect="non-scaling-stroke" />
    <path d="M 625,380 C 605,365 590,355 580,350 C 590,355 605,370 625,380" 
          stroke-width="1.2" opacity="0.30" vector-effect="non-scaling-stroke" />
    <path d="M 650,250 C 630,235 615,225 605,220 C 615,225 630,240 650,250" 
          stroke-width="1.2" opacity="0.30" vector-effect="non-scaling-stroke" />
    
    <!-- Top section branches -->
    <path d="M 660,150 C 690,130 710,115 720,105 C 710,115 690,125 660,150" 
          stroke-width="1.3" opacity="0.32" vector-effect="non-scaling-stroke" />
    <path d="M 665,100 C 645,85 630,75 620,70 C 630,75 645,90 665,100" 
          stroke-width="1.1" opacity="0.28" vector-effect="non-scaling-stroke" />
  </g>
  
  <!-- Artistically placed elongated leaves along the vine -->
  <!-- Bottom section - alternating left and right -->
  <use href="#vine-leaf" transform="translate(275, 1150) rotate(-65) scale(1.4)" opacity="0.42" />
  <use href="#small-leaf" transform="translate(295, 1090) rotate(120) scale(1.1)" opacity="0.35" />
  <use href="#vine-leaf" transform="translate(310, 1040) rotate(-55) scale(1.5)" opacity="0.45" />
  
  <!-- Lower-middle section - varied angles -->
  <use href="#vine-leaf" transform="translate(330, 990) rotate(130) scale(1.3)" opacity="0.40" />
  <use href="#small-leaf" transform="translate(355, 930) rotate(-45) scale(1.0)" opacity="0.32" />
  <use href="#vine-leaf" transform="translate(380, 890) rotate(125) scale(1.6)" opacity="0.48" />
  <use href="#vine-leaf" transform="translate(410, 840) rotate(-55) scale(1.4)" opacity="0.43" />
  <use href="#small-leaf" transform="translate(440, 790) rotate(140) scale(0.9)" opacity="0.35" />
  
  <!-- Middle section - alternating -->
  <use href="#vine-leaf" transform="translate(465, 740) rotate(-60) scale(1.45)" opacity="0.46" />
  <use href="#small-leaf" transform="translate(495, 690) rotate(130) scale(1.0)" opacity="0.33" />
  <use href="#vine-leaf" transform="translate(520, 640) rotate(125) scale(1.3)" opacity="0.42" />
  <use href="#vine-leaf" transform="translate(545, 590) rotate(-60) scale(1.4)" opacity="0.44" />
  <use href="#small-leaf" transform="translate(570, 540) rotate(135) scale(0.95)" opacity="0.34" />
  
  <!-- Upper-middle section - varied -->
  <use href="#vine-leaf" transform="translate(590, 490) rotate(-55) scale(1.35)" opacity="0.43" />
  <use href="#vine-leaf" transform="translate(605, 440) rotate(125) scale(1.3)" opacity="0.42" />
  <use href="#small-leaf" transform="translate(620, 390) rotate(-50) scale(1.0)" opacity="0.36" />
  <use href="#vine-leaf" transform="translate(630, 340) rotate(130) scale(1.4)" opacity="0.45" />
  <use href="#small-leaf" transform="translate(645, 290) rotate(-45) scale(0.95)" opacity="0.34" />
  
  <!-- Upper section - alternating -->
  <use href="#vine-leaf" transform="translate(650, 240) rotate(125) scale(1.25)" opacity="0.41" />
  <use href="#vine-leaf" transform="translate(655, 190) rotate(-55) scale(1.3)" opacity="0.43" />
  <use href="#small-leaf" transform="translate(660, 140) rotate(130) scale(0.9)" opacity="0.33" />
  <use href="#vine-leaf" transform="translate(665, 90) rotate(-55) scale(1.2)" opacity="0.40" />
  <use href="#small-leaf" transform="translate(668, 40) rotate(125) scale(0.85)" opacity="0.32" />
  
  <!-- Branch leaves - on the short connecting branches, varied angles -->
  <use href="#small-leaf" transform="translate(270, 1020) rotate(-85) scale(0.8)" opacity="0.28" />
  <use href="#small-leaf" transform="translate(420, 870) rotate(70) scale(0.75)" opacity="0.26" />
  <use href="#small-leaf" transform="translate(310, 965) rotate(105) scale(0.8)" opacity="0.28" />
  <use href="#small-leaf" transform="translate(415, 720) rotate(-80) scale(0.75)" opacity="0.26" />
  <use href="#small-leaf" transform="translate(470, 665) rotate(110) scale(0.8)" opacity="0.28" />
  <use href="#small-leaf" transform="translate(555, 625) rotate(75) scale(0.75)" opacity="0.26" />
  <use href="#small-leaf" transform="translate(560, 420) rotate(-85) scale(0.8)" opacity="0.28" />
  <use href="#small-leaf" transform="translate(685, 270) rotate(70) scale(0.75)" opacity="0.26" />
  <use href="#small-leaf" transform="translate(595, 365) rotate(105) scale(0.8)" opacity="0.28" />
  <use href="#small-leaf" transform="translate(620, 235) rotate(-80) scale(0.75)" opacity="0.26" />
  <use href="#small-leaf" transform="translate(705, 120) rotate(75) scale(0.8)" opacity="0.28" />
  <use href="#small-leaf" transform="translate(635, 85) rotate(-85) scale(0.75)" opacity="0.26" />
  
</svg>
