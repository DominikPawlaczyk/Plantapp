<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" style="background-color: transparent;">
  <defs>
    <!-- Template for a perfect cordate (heart-shaped) Epipremnum leaf with veins -->
    <g id="leaf" stroke="#52525B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Leaf outline (filled with background color to hide stems underneath) -->
      <path d="M 0,90 C -45,40 -55,5 -35,-15 C -20,-30 0,-15 0,0 C 0,-15 20,-30 35,-15 C 55,5 45,40 0,90" fill="#121212" vector-effect="non-scaling-stroke" />
      <!-- Center vein -->
      <path d="M 0,0 C 3,30 -3,60 0,90" fill="none" vector-effect="non-scaling-stroke" />
      <!-- Lateral veins (right) -->
      <path d="M 1,15 C 15,5 25,5 32,12" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,35 C 18,25 28,30 33,42" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M -1,55 C 12,50 18,55 20,65" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,75 C 8,72 12,75 14,82" fill="none" vector-effect="non-scaling-stroke" />
      <!-- Lateral veins (left) -->
      <path d="M -1,15 C -15,5 -25,5 -32,12" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,35 C -18,25 -28,30 -33,42" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 1,55 C -12,50 -18,55 -20,65" fill="none" vector-effect="non-scaling-stroke" />
      <path d="M 0,75 C -8,72 -12,75 -14,82" fill="none" vector-effect="non-scaling-stroke" />
    </g>
  </defs>
  
  <g stroke="#52525B" stroke-linecap="round" fill="none">
    <!-- Main Stem (Bottom to Top) -->
    <path d="M 450,1200 C 300,1050 600,900 450,700 C 300,500 550,350 400,150 C 300,0 350,-50 350,-50" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    
    <!-- Branch 1 -->
    <path d="M 530,850 C 650,800 700,700 750,600" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    
    <!-- Branch 2 -->
    <path d="M 370,600 C 250,600 200,500 100,400" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    
    <!-- Branch 3 -->
    <path d="M 490,300 C 550,250 580,150 600,50" stroke-width="1.5" vector-effect="non-scaling-stroke" />
  </g>
  
  <!-- Leaves on Main Stem -->
  <use href="#leaf" transform="translate(410, 1080) rotate(-35) scale(1.6)" />
  <use href="#leaf" transform="translate(490, 980) rotate(45) scale(1.8)" />
  <use href="#leaf" transform="translate(520, 860) rotate(15) scale(1.5)" />
  <use href="#leaf" transform="translate(460, 760) rotate(-40) scale(1.7)" />
  <use href="#leaf" transform="translate(380, 620) rotate(-65) scale(1.4)" />
  <use href="#leaf" transform="translate(440, 480) rotate(55) scale(1.6)" />
  <use href="#leaf" transform="translate(500, 320) rotate(35) scale(1.5)" />
  <use href="#leaf" transform="translate(410, 180) rotate(-25) scale(1.3)" />
  <use href="#leaf" transform="translate(360, 50) rotate(-45) scale(1.1)" />

  <!-- Leaves on Branch 1 -->
  <use href="#leaf" transform="translate(600, 780) rotate(65) scale(1.4)" />
  <use href="#leaf" transform="translate(670, 680) rotate(25) scale(1.5)" />
  <use href="#leaf" transform="translate(730, 610) rotate(70) scale(1.2)" />

  <!-- Leaves on Branch 2 -->
  <use href="#leaf" transform="translate(290, 590) rotate(-110) scale(1.3)" />
  <use href="#leaf" transform="translate(200, 520) rotate(-35) scale(1.4)" />
  <use href="#leaf" transform="translate(120, 430) rotate(-75) scale(1.1)" />

  <!-- Leaves on Branch 3 -->
  <use href="#leaf" transform="translate(530, 240) rotate(75) scale(1.3)" />
  <use href="#leaf" transform="translate(575, 140) rotate(35) scale(1.4)" />
  <use href="#leaf" transform="translate(600, 50) rotate(80) scale(1.1)" />
  
</svg>
