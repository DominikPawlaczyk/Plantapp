<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" style="background-color: transparent;">
  <defs>
    <!-- Large Monstera leaf with holes and splits -->
    <g id="large-leaf" stroke="#8B7355" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Monstera outline with characteristic splits -->
      <path d="M 0,0 
               C -5,-10 -15,-15 -25,-12 C -35,-9 -42,-2 -45,10
               L -48,25 C -50,35 -48,45 -42,52
               L -35,65 C -30,72 -22,76 -14,75
               L 0,72
               L 14,75 C 22,76 30,72 35,65
               L 42,52 C 48,45 50,35 48,25
               L 45,10 C 42,-2 35,-9 25,-12 C 15,-15 5,-10 0,0 Z" 
            vector-effect="non-scaling-stroke" />
      
      <!-- Center vein -->
      <path d="M 0,0 L 0,72" vector-effect="non-scaling-stroke" />
      
      <!-- Side veins -->
      <path d="M 0,15 L -35,25" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,15 L 35,25" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,35 L -30,45" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,35 L 30,45" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,55 L -22,62" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,55 L 22,62" vector-effect="non-scaling-stroke" opacity="0.7" />
      
      <!-- Characteristic Monstera holes/fenestrations -->
      <ellipse cx="-25" cy="35" rx="6" ry="10" vector-effect="non-scaling-stroke" opacity="0.8" />
      <ellipse cx="25" cy="35" rx="6" ry="10" vector-effect="non-scaling-stroke" opacity="0.8" />
      <ellipse cx="-18" cy="55" rx="5" ry="8" vector-effect="non-scaling-stroke" opacity="0.8" />
      <ellipse cx="18" cy="55" rx="5" ry="8" vector-effect="non-scaling-stroke" opacity="0.8" />
      
      <!-- Edge splits -->
      <path d="M -42,52 L -38,48" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 42,52 L 38,48" vector-effect="non-scaling-stroke" opacity="0.7" />
    </g>
    
    <!-- Medium Pothos/Epipremnum heart-shaped leaf -->
    <g id="medium-leaf" stroke="#8B7355" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 0,0 C -18,-8 -30,-5 -35,8 C -38,20 -32,35 -18,48 C -8,58 0,65 0,65 C 0,65 8,58 18,48 C 32,35 38,20 35,8 C 30,-5 18,-8 0,0" 
            vector-effect="non-scaling-stroke" />
      <path d="M 0,0 L 0,65" vector-effect="non-scaling-stroke" />
      <path d="M 0,20 C 10,24 16,30 20,38" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,20 C -10,24 -16,30 -20,38" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,42 C 8,46 12,52 14,58" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,42 C -8,46 -12,52 -14,58" vector-effect="non-scaling-stroke" opacity="0.7" />
    </g>
    
    <!-- Small Pothos leaf -->
    <g id="small-leaf" stroke="#8B7355" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 0,0 C -12,-4 -18,0 -20,8 C -21,16 -16,26 -8,34 C 0,40 0,40 0,40 C 0,40 8,34 16,26 C 21,16 20,8 18,0 C 16,-4 12,-4 0,0" 
            vector-effect="non-scaling-stroke" />
      <path d="M 0,0 L 0,40" vector-effect="non-scaling-stroke" />
      <path d="M 0,15 C 6,18 10,24 12,30" vector-effect="non-scaling-stroke" opacity="0.7" />
      <path d="M 0,15 C -6,18 -10,24 -12,30" vector-effect="non-scaling-stroke" opacity="0.7" />
    </g>
  </defs>
  
  <!-- Main flowing vine -->
  <g stroke="#8B7355" stroke-linecap="round" fill="none">
    <!-- Primary vine stem -->
    <path d="M 150,1200 
             C 160,1150 175,1100 200,1050
             C 225,1000 260,960 300,920
             C 340,880 385,850 420,810
             C 455,770 480,720 490,670
             C 500,620 495,570 475,525
             C 455,480 425,445 400,410
             C 375,375 360,345 360,310
             C 360,275 375,245 405,220
             C 435,195 475,180 520,175
             C 565,170 610,175 650,185
             C 690,195 720,205 740,210
             L 760,215" 
          stroke-width="2.5" opacity="0.6" vector-effect="non-scaling-stroke" />
    
    <!-- Secondary branches -->
    <path d="M 200,1050 C 170,1070 145,1085 130,1095" stroke-width="1.8" opacity="0.5" vector-effect="non-scaling-stroke" />
    <path d="M 300,920 C 280,945 265,965 255,980" stroke-width="1.6" opacity="0.5" vector-effect="non-scaling-stroke" />
    <path d="M 420,810 C 395,830 375,845 365,855" stroke-width="1.6" opacity="0.5" vector-effect="non-scaling-stroke" />
    <path d="M 475,525 C 505,540 530,550 550,555" stroke-width="1.6" opacity="0.5" vector-effect="non-scaling-stroke" />
    <path d="M 400,410 C 425,425 445,435 460,440" stroke-width="1.5" opacity="0.5" vector-effect="non-scaling-stroke" />
    <path d="M 650,185 C 675,170 695,155 710,145" stroke-width="1.6" opacity="0.5" vector-effect="non-scaling-stroke" />
    <path d="M 520,175 C 540,155 555,140 565,130" stroke-width="1.5" opacity="0.5" vector-effect="non-scaling-stroke" />
  </g>
  
  <!-- Leaves placed along the vine -->
  <!-- Bottom large leaf -->
  <use href="#large-leaf" transform="translate(130, 1100) rotate(-25) scale(1.8)" opacity="0.55" />
  
  <!-- Lower section -->
  <use href="#small-leaf" transform="translate(175, 1070) rotate(45) scale(1.1)" opacity="0.45" />
  <use href="#medium-leaf" transform="translate(220, 1020) rotate(-35) scale(1.3)" opacity="0.5" />
  
  <!-- Middle-lower section -->
  <use href="#large-leaf" transform="translate(270, 960) rotate(15) scale(1.6)" opacity="0.55" />
  <use href="#small-leaf" transform="translate(285, 945) rotate(-60) scale(0.9)" opacity="0.4" />
  
  <!-- Center large leaf -->
  <use href="#large-leaf" transform="translate(380, 840) rotate(-10) scale(2.0)" opacity="0.6" />
  
  <!-- Middle section -->
  <use href="#medium-leaf" transform="translate(430, 790) rotate(25) scale(1.4)" opacity="0.5" />
  <use href="#small-leaf" transform="translate(375, 855) rotate(140) scale(1.0)" opacity="0.45" />
  
  <!-- Upper-middle section -->
  <use href="#medium-leaf" transform="translate(485, 650) rotate(-20) scale(1.3)" opacity="0.5" />
  <use href="#large-leaf" transform="translate(450, 480) rotate(5) scale(1.7)" opacity="0.55" />
  
  <!-- Upper section -->
  <use href="#medium-leaf" transform="translate(520, 200) rotate(-15) scale(1.2)" opacity="0.48" />
  <use href="#small-leaf" transform="translate(565, 130) rotate(30) scale(0.95)" opacity="0.42" />
  
  <!-- Top leaves -->
  <use href="#large-leaf" transform="translate(720, 130) rotate(-5) scale(1.5)" opacity="0.52" />
  <use href="#medium-leaf" transform="translate(680, 80) rotate(20) scale(1.1)" opacity="0.45" />
  
  <!-- Branch leaves -->
  <use href="#small-leaf" transform="translate(145, 1085) rotate(-70) scale(0.85)" opacity="0.38" />
  <use href="#medium-leaf" transform="translate(550, 555) rotate(45) scale(1.2)" opacity="0.48" />
  <use href="#small-leaf" transform="translate(455, 435) rotate(-80) scale(0.9)" opacity="0.4" />
  <use href="#small-leaf" transform="translate(705, 150) rotate(60) scale(0.95)" opacity="0.42" />
  
  <!-- Falling leaf (detached) -->
  <use href="#medium-leaf" transform="translate(580, 580) rotate(75) scale(1.25)" opacity="0.48" />
  
</svg>
